workflows:
  rts_tracking_android:
    name: RTS Tracking Android
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rts_tracking_keystore
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Build signed Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  rts_tracking_ios:
    name: RTS Tracking iOS
    max_build_duration: 60
    integrations:
      app_store_connect: CityLogisticsASC
    environment:
      flutter: stable
      ios_signing:
        provisioning_profiles:
          - rts_tracking_app_store_codmagic
        certificates:
          - rts_tracking_distribution
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install --repo-update
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
