workflows:
  rts_tracking_android:
    name: RTS Tracking Android
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - rts_tracking_keystore
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Build signed Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  rts_tracking_ios:
    name: RTS Tracking iOS
    max_build_duration: 60
    integrations:
      app_store_connect: CityLogisticsASC
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rts.tracking
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
