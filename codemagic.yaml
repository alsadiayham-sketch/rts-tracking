workflows:
  rts_tracking_android:
    name: RTS Tracking Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - rts_tracking_api
      android_signing:
        - rts_tracking_keystore
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Build signed Android App Bundle
        script: |
          test -n "$RTS_API_BASE_URL"
          flutter build appbundle --release \
            --dart-define=RTS_API_BASE_URL="$RTS_API_BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  rts_tracking_ios:
    name: RTS Tracking iOS
    max_build_duration: 60
    integrations:
      app_store_connect: CityLogisticsASC
    environment:
      flutter: stable
      groups:
        - rts_tracking_api
      ios_signing:
        provisioning_profiles:
          - rts_tracking_app_store_codmagic
        certificates:
          - rts_tracking_distribution
    scripts:
      - name: Install packages
        script: flutter pub get
      - name: Select next iOS build number
        script: |
          set -e
          APP_ID="${APP_STORE_APPLE_ID:-6819282346}"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "Invalid latest TestFlight build number: $LATEST"
              exit 1
              ;;
          esac
          NEXT=$((LATEST + 1))
          CURRENT=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)
          if [ -z "$CURRENT" ]; then
            echo "Could not read the current Flutter build number."
            exit 1
          fi
          if [ "$CURRENT" -gt "$NEXT" ]; then
            NEXT=$CURRENT
          fi
          echo "Latest TestFlight build: $LATEST -> building $NEXT"
          sed -i.bak "s/^version: .*/version: 1.0.0+$NEXT/" pubspec.yaml
          rm -f pubspec.yaml.bak
          flutter pub get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install --repo-update
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          test -n "$RTS_API_BASE_URL"
          flutter build ios --release \
            --dart-define=RTS_API_BASE_URL="$RTS_API_BASE_URL" \
            --no-codesign
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
